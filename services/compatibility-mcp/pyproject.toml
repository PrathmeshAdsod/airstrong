[project]
name = "airstrong-compatibility-mcp"
version = "0.1.0"
description = "Real MCP and PostgreSQL compatibility probe for the Airstrong sponsor stack"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.1.1",
  "psycopg[binary]==3.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
